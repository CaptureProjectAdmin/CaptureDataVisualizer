<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capture App Visualizer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.30/dist/uPlot.iife.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>Capture App Visualizer</h1>
        <p id="recording-meta">Loading recording…</p>
      </div>
      <div class="topbar-actions">
        <label class="path-input">
          <span>Data folder</span>
          <input id="data-path" type="text" placeholder="Data" />
        </label>
        <button id="reload-btn" type="button">Load</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="panel">
          <div class="panel-header">
            <h2>Sensors</h2>
            <div class="panel-actions">
              <button id="select-all" type="button" class="link-btn">All</button>
              <button id="select-none" type="button" class="link-btn">None</button>
            </div>
          </div>
          <div id="sensor-list" class="sensor-list"></div>
        </div>

        <div class="panel media-panel">
          <h2>Media</h2>
          <div id="media-status" class="media-status"></div>
        </div>
      </aside>

      <main class="main">
        <section class="media-row">
          <div class="video-card">
            <div class="video-card-header">
              <div class="card-label">Video / Camera</div>
              <div class="video-rotate-controls">
                <button id="rotate-left" type="button" title="Rotate 90° counter-clockwise">↺ 90°</button>
                <span id="rotation-label">0°</span>
                <button id="rotate-right" type="button" title="Rotate 90° clockwise">↻ 90°</button>
              </div>
            </div>
            <div id="video-stage" class="video-stage rotate-0">
              <video id="video-player" playsinline></video>
              <img id="camera-frame" alt="Camera frame" hidden />
            </div>
            <div id="video-controls" class="video-controls" hidden>
              <button id="video-play-btn" type="button" aria-label="Play video">▶</button>
              <span class="video-time-readout">
                <span id="video-current-time">0:00</span>
                <span class="sep">/</span>
                <span id="video-total-time">0:00</span>
              </span>
              <input id="video-timeline" type="range" min="0" max="1000" value="0" step="0.01" aria-label="Video position" />
              <div class="video-volume-group">
                <button id="video-mute-btn" type="button" aria-label="Mute video">🔊</button>
                <input id="video-volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Video volume" />
              </div>
              <button id="video-fullscreen-btn" type="button" aria-label="Fullscreen">⛶</button>
            </div>
            <div id="video-placeholder" class="placeholder">No video file found in export</div>
          </div>
          <div class="audio-card">
            <div class="card-label">Audio</div>
            <audio id="audio-player" controls></audio>
            <div id="audio-placeholder" class="placeholder">No audio file found — loudness chart available from Microphone.csv</div>
          </div>
        </section>

        <section class="map-section" id="map-section" hidden>
          <div class="card-label">GPS track</div>
          <div id="map"></div>
        </section>

        <section class="charts-section">
          <div id="charts-grid" class="charts-grid"></div>
        </section>
      </main>
    </div>

    <footer class="transport">
      <button id="play-btn" type="button" aria-label="Play">▶</button>
      <input id="timeline" type="range" min="0" max="1000" value="0" step="0.01" />
      <div class="time-readout">
        <span id="current-time">0:00</span>
        <span class="sep">/</span>
        <span id="total-time">0:00</span>
      </div>
      <label class="speed-control">
        Speed
        <select id="playback-speed">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
      </label>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
